<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Erick Rodrigues, software engineer and FIAP student: journey, projects, and stack."
    />
    <meta name="theme-color" content="#0c1424" />
    <script>
      // Aplica o tema salvo antes da primeira pintura, evitando piscar. Padrão: escuro.
      try {
        var saved = localStorage.getItem('theme')
        document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <title>Erick Rodrigues | Software Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />
